<script>
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const analyzeBtn = document.getElementById("analyzeBtn");
const statusBox = document.getElementById("status");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently:true });

let imageReady = false;

fileInput.addEventListener("change", function () {
  imageReady = false;
  analyzeBtn.disabled = true;

  const file = this.files && this.files[0];

  statusBox.style.display = "block";

  if (!file) {
    statusBox.textContent = "❌ No screenshot selected";
    return;
  }

  statusBox.textContent = "⏳ Screenshot loading...";

  const reader = new FileReader();

  reader.onload = function (e) {
    const img = new Image();

    img.onload = function () {
      preview.src = e.target.result;
      preview.style.display = "block";

      imageReady = true;
      analyzeBtn.disabled = false;

      statusBox.textContent =
        "✅ Screenshot loaded — DEEP ANALYZE চাপো";
    };

    img.onerror = function () {
      imageReady = false;
      analyzeBtn.disabled = true;
      statusBox.textContent =
        "❌ Screenshot load হয়নি";
    };

    img.src = e.target.result;
  };

  reader.onerror = function () {
    statusBox.textContent =
      "❌ File read error";
  };

  reader.readAsDataURL(file);
});


analyzeBtn.addEventListener("click", function () {

  if (!imageReady) {
    alert("আগে screenshot select করো");
    return;
  }

  analyzeBtn.disabled = true;
  analyzeBtn.textContent = "ANALYZING...";

  statusBox.style.display = "block";
  statusBox.textContent = "🔍 Deep analysis চলছে...";

  setTimeout(function () {

    try {
      runSimpleAnalysis();
    } catch (err) {
      console.error(err);
      statusBox.textContent =
        "❌ Analysis error: " + err.message;
    }

    analyzeBtn.disabled = false;
    analyzeBtn.textContent = "DEEP ANALYZE";

  }, 150);
});


function runSimpleAnalysis() {

  const W = preview.naturalWidth;
  const H = preview.naturalHeight;

  if (!W || !H) {
    throw new Error("Invalid screenshot size");
  }

  const targetW = Math.min(700, W);
  const scale = targetW / W;

  canvas.width = Math.round(W * scale);
  canvas.height = Math.round(H * scale);

  ctx.drawImage(
    preview,
    0, 0,
    canvas.width,
    canvas.height
  );

  const imageData = ctx.getImageData(
    0, 0,
    canvas.width,
    canvas.height
  );

  const data = imageData.data;

  let green = 0;
  let red = 0;

  for (let i = 0; i < data.length; i += 4) {

    const r = data[i];
    const g = data[i + 1];
    const b = data[i + 2];

    if (
      g > r * 1.12 &&
      g > b * 0.95 &&
      g > 80
    ) {
      green++;
    }

    if (
      r > g * 1.12 &&
      r > b * 0.95 &&
      r > 80
    ) {
      red++;
    }
  }

  let signal = "NO TRADE";
  let confidence = 0;

  const total = green + red;

  if (total > 0) {

    const diff = Math.abs(green - red);
    confidence = Math.round((diff / total) * 100);

    if (
      green > red * 1.35 &&
      confidence >= 20
    ) {
      signal = "UP";
    }

    if (
      red > green * 1.35 &&
      confidence >= 20
    ) {
      signal = "DOWN";
    }
  }

  showResult({
    signal: signal,
    confidence: confidence,
    count: total,
    quality:
      total > 1000 ? "HIGH" :
      total > 300 ? "MEDIUM" :
      "LOW",
    trend: signal === "UP" ? "BULLISH" :
           signal === "DOWN" ? "BEARISH" :
           "MIXED",
    momentum: signal === "UP" ? "BULLISH" :
              signal === "DOWN" ? "BEARISH" :
              "MIXED",
    structure: "AUTO",
    pressure: signal,
    bull: green,
    bear: red,
    reasons: [
      "Screenshot successfully analyzed",
      "Green pixels: " + green,
      "Red pixels: " + red
    ]
  });

  statusBox.textContent = "✅ Analysis complete";
}


function showResult(r) {

  const resultBox = document.getElementById("result");
  const signal = document.getElementById("signal");

  resultBox.style.display = "block";

  signal.textContent = r.signal;
  signal.className = "";

  if (r.signal === "UP") {
    signal.classList.add("up");
  } else if (r.signal === "DOWN") {
    signal.classList.add("down");
  } else {
    signal.classList.add("yellow");
  }

  document.getElementById("strength").textContent =
    "Confidence: " + r.confidence + "/100";

  document.getElementById("count").textContent = r.count;
  document.getElementById("quality").textContent = r.quality;
  document.getElementById("trend").textContent = r.trend;
  document.getElementById("momentum").textContent = r.momentum;
  document.getElementById("structure").textContent = r.structure;
  document.getElementById("pressure").textContent = r.pressure;
  document.getElementById("bull").textContent = r.bull;
  document.getElementById("bear").textContent = r.bear;

  const confirmations =
    document.getElementById("confirmations");

  confirmations.innerHTML = "";

  r.reasons.forEach(function (reason) {

    const span =
      document.createElement("span");

    span.className = "tag";
    span.textContent = reason;

    confirmations.appendChild(span);
  });

  resultBox.scrollIntoView({
    behavior: "smooth"
  });
}
  </script>
